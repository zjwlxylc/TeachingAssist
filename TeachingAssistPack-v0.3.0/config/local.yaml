environment: production
api_prefix: /api/v1

server:
  host: 0.0.0.0
  port: 8080
  fallback_ports:
    - 8081
    - 8888

storage:
  local_root: C:/TeachingAssist
  # removable_root 省略：修复后的 detect_removable_root 会自动识别程序所在的可移动磁盘
  # （U 盘盘符变化也能自适应）。如需固定指定，可写绝对路径，例如 E:/

logging:
  level: INFO
  file_name: teaching_assist.log
